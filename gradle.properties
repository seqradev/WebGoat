# Project properties
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# IMPORTANT: Gradle must run with JDK 21 (not JDK 25) due to Kotlin 2.1 version parsing bug.
# Set JAVA_HOME to JDK 21 before running Gradle. The Java toolchain will still use JDK 25
# for Java compilation. Example: JAVA_HOME=/path/to/jdk21 ./gradlew build

# Kotlin
kotlin.code.style=official

# Gradle configuration
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# WebGoat configuration
webgoat.port=8080
webgoat.context=/WebGoat
webwolf.port=9090
webwolf.context=/WebWolf
